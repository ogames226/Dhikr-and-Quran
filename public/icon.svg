<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F5C4D"/>
      <stop offset="50%" stop-color="#0B463A"/>
      <stop offset="100%" stop-color="#072F27"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7BE"/>
      <stop offset="40%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#9B7811"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with emerald gradient -->
  <rect width="512" height="512" rx="128" fill="url(#emeraldGrad)"/>
  
  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="208" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8"/>

  <!-- Islamic 8-pointed star base motif -->
  <g transform="translate(256, 256) scale(0.95)" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.4">
    <rect x="-140" y="-140" width="280" height="280" rx="20"/>
    <rect x="-140" y="-140" width="280" height="280" rx="20" transform="rotate(45)"/>
  </g>

  <!-- Open Holy Quran Silhouette -->
  <g id="quran-book" transform="translate(256, 280)">
    <!-- Stand / Rihal -->
    <path d="M-90,65 L0,15 L90,65 L70,85 L0,40 L-70,85 Z" fill="url(#goldGrad)" opacity="0.9" />
    
    <!-- Left Page -->
    <path d="M-10,10 C-50,-5 -110,-10 -150,-2 C-155,5 -152,45 -148,55 C-110,48 -50,52 -10,65 Z" fill="#FDFBF7" stroke="#C9A227" stroke-width="3"/>
    <!-- Left Page Lines -->
    <line x1="-135" y1="12" x2="-25" y2="24" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="-130" y1="26" x2="-30" y2="36" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="-125" y1="40" x2="-35" y2="48" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

    <!-- Right Page -->
    <path d="M10,10 C50,-5 110,-10 150,-2 C155,5 152,45 148,55 C110,48 50,52 10,65 Z" fill="#FDFBF7" stroke="#C9A227" stroke-width="3"/>
    <!-- Right Page Lines -->
    <line x1="25" y1="24" x2="135" y2="12" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="30" y1="36" x2="130" y2="26" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="35" y1="48" x2="125" y2="40" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

    <!-- Spine -->
    <path d="M-10,10 C0,15 0,60 -10,65 C0,60 0,15 10,10 Z" fill="#C9A227"/>
  </g>

  <!-- Golden Crescent Moon & Star above Quran -->
  <g transform="translate(256, 155)">
    <!-- Crescent -->
    <path d="M15,-55 C48,-55 75,-28 75,5 C75,38 48,65 15,65 C-5,65 -23,55 -35,40 C-10,40 15,20 15,-10 C15,-30 5,-45 -15,-50 C-6,-53 4,-55 15,-55 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
    <!-- 8-pointed star -->
    <path d="M-45,-15 L-38,-28 L-45,-41 L-32,-41 L-24,-52 L-16,-41 L-3,-41 L-10,-28 L-3,-15 L-16,-15 L-24,-4 L-32,-15 Z" fill="url(#goldGrad)"/>
  </g>
</svg>
